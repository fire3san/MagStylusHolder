<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f14; }
      .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
      .device-body { fill: #151d28; stroke: #334155; stroke-width: 2; rx: 12; }
      .screen-area { fill: #0d1520; stroke: #1e293b; stroke-width: 1.5; rx: 6; }
      .hinge-axis { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 6 6; }
      .hinge-label { fill: #ef4444; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .holder-base { fill: rgba(30, 41, 59, 0.85); stroke: #38bdf8; stroke-width: 2; rx: 34; }
      .holder-magsafe { fill: none; stroke: #0284c7; stroke-width: 2.5; stroke-dasharray: 5 3; }
      .scabbard-body { fill: #1e293b; stroke: #10b981; stroke-width: 2.5; rx: 6; }
      .pencil-body { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 4; }
      .pencil-tip { fill: #64748b; stroke: #475569; stroke-width: 1; }
      .dimension-line { stroke: #94a3b8; stroke-width: 1.2; marker-end: url(#arrow); marker-start: url(#arrow-start); }
      .text-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; }
      .text-subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .text-dim { fill: #38bdf8; font-family: monospace; font-size: 12px; font-weight: 600; }
      .text-clearance { fill: #10b981; font-family: monospace; font-size: 12px; font-weight: 700; }
      .text-danger { fill: #f43f5e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .badge-sig { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 1px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1 L 0 5 L 8 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" class="bg" />

  <!-- Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" class="badge-sig">★ KINEMATICS &amp; CLEARANCE BLUEPRINT (AURA HOMOLOGOUS)</text>
    <text x="0" y="26" class="text-title">AURA DUO — iPhone Duo 180° 雙屏展開鉸鏈中軸防干涉與貼邊動態圖</text>
    <text x="0" y="48" class="text-subtitle">承襲 AURA 同向左翼美學，偏置微調為 -37.0 mm 緊貼機邊，Apple Pencil Pro 緊密依傍，徹底杜絕卡中軸</text>
  </g>

  <!-- Coordinate & Device Layout Area -->
  <g transform="translate(80, 140)">
    <!-- Grid Reference Lines -->
    <line x1="0" y1="200" x2="840" y2="200" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="400" class="grid-line" />

    <!-- Left Chassis (Housing B: Camera + MagSafe Back, 74mm) -->
    <rect x="90" y="20" width="290" height="360" rx="16" class="device-body" />
    <rect x="105" y="35" width="260" height="330" rx="10" class="screen-area" />
    <text x="250" y="65" fill="#64748b" font-family="sans-serif" font-size="13px" font-weight="600" text-anchor="middle">Housing B / MagSafe Panel (74 mm)</text>
    <text x="250" y="82" fill="#475569" font-family="monospace" font-size="11px" text-anchor="middle">X ∈ [-74, 0] mm · 背板相機鏡頭側</text>

    <!-- Central Titanium Hinge Axis (X = 0) -->
    <rect x="393" y="15" width="14" height="370" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <line x1="400" y1="5" x2="400" y2="415" class="hinge-axis" />
    <text x="400" y="435" class="hinge-label" text-anchor="middle">中央折疊中軸 (Hinge Axis X=0)</text>
    <text x="400" y="450" fill="#f43f5e" font-family="sans-serif" font-size="11px" font-weight="600" text-anchor="middle">杜絕向內干涉 / 避開轉軸樞紐</text>

    <!-- Right Chassis (Housing A: Cover Display Panel, 74mm) -->
    <rect x="420" y="20" width="290" height="360" rx="16" class="device-body" />
    <rect x="435" y="35" width="260" height="330" rx="10" class="screen-area" />
    <text x="565" y="195" fill="#475569" font-family="sans-serif" font-size="14px" font-weight="600" text-anchor="middle">Cover Display Panel (74 mm)</text>
    <text x="565" y="215" fill="#334155" font-family="monospace" font-size="11px" text-anchor="middle">X ∈ [0, +74] mm · 外螢幕背面側</text>

    <!-- AURA DUO Baseplate Mounted on Left Panel -->
    <!-- Base center at X = 250 (scaled -37mm), Y = 200 -->
    <!-- MagSafe ring radius 58.4 mm scaled -> r=58 -->
    <circle cx="250" cy="200" r="58" class="holder-magsafe" />
    
    <!-- Base plate body with hinge notch on right (X > 308) -->
    <path d="M 250 142 
             A 58 58 0 0 0 192 200 
             A 58 58 0 0 0 250 258 
             L 374 258 
             A 12 12 0 0 0 386 246 
             L 386 154 
             A 12 12 0 0 0 374 142 
             Z" class="holder-base" />

    <!-- 8.5mm Clearance Gap to Hinge -->
    <rect x="386" y="145" width="14" height="110" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2" rx="2" />
    <line x1="400" y1="120" x2="386" y2="120" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)" />
    <text x="393" y="110" class="text-clearance" text-anchor="middle">8.5 mm 避空餘量</text>

    <!-- N52 Tiered Magnets inside Base -->
    <circle cx="250" cy="180" r="6" fill="#38bdf8" />
    <circle cx="250" cy="200" r="6" fill="#38bdf8" />
    <circle cx="250" cy="220" r="6" fill="#38bdf8" />
    <circle cx="220" cy="190" r="6" fill="#38bdf8" />
    <circle cx="220" cy="210" r="6" fill="#38bdf8" />

    <!-- Lateral Scabbard Extended to the LEFT (Same Direction as AURA) -->
    <!-- MagSafe Center at 250. Offset -37mm scaled -> 250 - 145 = 105 (flush hugging outer left edge!) -->
    <!-- Scabbard body: X=95 to 135, Y=110 to 300 -->
    <path d="M 210 170 
             L 125 160 
             L 125 110 
             A 10 10 0 0 0 105 110 
             L 105 280 
             L 115 305 
             L 125 280 
             L 125 240 
             L 210 230 
             Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Scabbard Internal Bore (Ø9.3mm for Apple Pencil Pro Ø8.9mm) -->
    <rect x="107" y="115" width="16" height="175" rx="8" class="scabbard-body" />

    <!-- Apple Pencil Pro Docked Inside Scabbard (X = 115) -->
    <g transform="translate(115, 200)">
      <!-- Pencil Shaft -->
      <rect x="-6" y="-170" width="12" height="310" rx="5" class="pencil-body" />
      <!-- Pencil Tip -->
      <path d="M -6 140 L 0 162 L 6 140 Z" class="pencil-tip" />
      <!-- Apple Logo / Double-tap sensor notch -->
      <rect x="-4" y="-130" width="8" height="14" rx="2" fill="#e2e8f0" />
      <!-- Label on Pencil -->
      <text x="0" y="-30" fill="#475569" font-family="sans-serif" font-size="10px" font-weight="700" transform="rotate(-90)" text-anchor="middle">Apple Pencil Pro</text>
    </g>

    <!-- Kinematics Callout & Dimension Lines -->
    <!-- Distance from MagSafe center (250) to Scabbard (115) -->
    <line x1="250" y1="315" x2="115" y2="315" class="dimension-line" />
    <line x1="250" y1="265" x2="250" y2="325" stroke="#475569" stroke-width="1" />
    <line x1="115" y1="295" x2="115" y2="325" stroke="#475569" stroke-width="1" />
    <text x="182" y="333" class="text-dim" text-anchor="middle">-37.0 mm 緊貼機邊偏置 (與 AURA 同向)</text>

    <!-- Directional Badge -->
    <g transform="translate(20, 80)">
      <rect x="0" y="-15" width="165" height="65" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.5" />
      <text x="82" y="6" class="text-clearance" text-anchor="middle">✓ 與 AURA 同向外側長鞘</text>
      <text x="82" y="24" fill="#a7f3d0" font-family="sans-serif" font-size="11px" text-anchor="middle">向左貼邊，折疊展開皆通暢</text>
      <text x="82" y="40" fill="#6ee7b7" font-family="monospace" font-size="10px" text-anchor="middle">Apple Pencil Pro Ø8.9mm</text>
    </g>

    <!-- Erroneous Inner Direction Badge -->
    <g transform="translate(260, 290)">
      <rect x="-10" y="-18" width="130" height="50" rx="8" fill="rgba(244, 63, 94, 0.1)" stroke="#f43f5e" stroke-width="1.2" />
      <text x="55" y="2" class="text-danger" text-anchor="middle">✕ 內向朝中軸</text>
      <text x="55" y="20" fill="#fda4af" font-family="sans-serif" font-size="11px" text-anchor="middle">避免干涉轉軸樞紐</text>
    </g>
  </g>

  <!-- Footer Specification Box -->
  <g transform="translate(80, 560)">
    <rect x="0" y="0" width="840" height="60" rx="10" fill="#131d2a" stroke="#1e293b" stroke-width="1" />
    <text x="25" y="25" fill="#f8fafc" font-family="sans-serif" font-size="13px" font-weight="700">AURA DUO 關鍵動態參數：</text>
    <text x="25" y="44" fill="#94a3b8" font-family="sans-serif" font-size="12px">① 雙屏展開 180° 總寬 148 mm · ② 中軸避讓餘量 8.5 mm · ③ 筆鞘側向偏置 -37.0 mm (與 AURA 同向緊貼機邊) · ④ 筆槽內徑 Ø9.3 mm · ⑤ 5 磁 N52 梯次矩陣</text>
  </g>
</svg>
