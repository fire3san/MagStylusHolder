<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<rect width="210" height="297" fill="white"/>
<g font-family="sans-serif" fill="#222">
<text x="20" y="20" font-size="6">BOOX holder v0.1 — placement template</text>
<text x="20" y="29" font-size="3.5">Print at 100%. Verify the scale below. All dimensions in mm.</text>
<text x="20" y="36" font-size="3.5">Reader envelope only; case and ring position are unmeasured.</text>
<rect x="50.5" y="50" width="109" height="149" rx="5" fill="none" stroke="#333" stroke-width=".4"/>
<g transform="translate(105 124.5)">
<circle r="32" fill="none" stroke="#777" stroke-width=".35"/>
<circle r="29.2" fill="none" stroke="#777" stroke-width=".25" stroke-dasharray="1 1"/>
<circle r="23.8" fill="none" stroke="#777" stroke-width=".25" stroke-dasharray="1 1"/>
<path d="M-4 0H4 M0 -4V4" fill="none" stroke="#333" stroke-width=".3"/>
<g transform="rotate(34)">
<rect x="-7.2" y="-83.25" width="14.4" height="166.5" rx="2.5" fill="none" stroke="#007777" stroke-width=".4"/>
<rect x="-4.5" y="-78.75" width="9" height="157.5" rx="3" fill="none" stroke="#333" stroke-width=".3"/>
<rect x="-12" y="-47" width="24" height="14" rx="2" fill="none" stroke="#007777" stroke-width=".3"/>
<rect x="-12" y="33" width="24" height="14" rx="2" fill="none" stroke="#007777" stroke-width=".3"/>
</g></g>
<text x="20" y="213" font-size="3.5">B cradle at 34° from vertical; ring centre assumed at reader centre.</text>
<text x="20" y="221" font-size="3.5">Align the centre cross to your actual case ring and check every edge.</text>
<text x="20" y="229" font-size="3.5">Corner radius is illustrative. Confirm button and folded-cover access.</text>
<path d="M30 249V255 M30 252H130 M130 249V255" stroke="#222" stroke-width=".4"/>
<text x="68" y="262" font-size="4">100 mm check</text>
<text x="20" y="281" font-size="3.5">This template checks position only, not depth, retention or magnetic force.</text>
</g></svg>
